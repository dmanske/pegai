<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pegaí</title>
<style>
  :root { --tinta: #111; --cinza: #6b6b6b; --linha: #e7e7e7; --fundo: #fafafa; --ok: #1f8a4c; --azul: #0095f6; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--tinta); background: #fff; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--linha); }
  header img { width: 28px; height: 28px; }
  header b { font-size: 15px; }
  header small { display: block; color: var(--cinza); font-size: 11.5px; }
  h2 { margin: 0; padding: 12px 16px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--cinza); }
  ul { list-style: none; margin: 0; padding: 0 8px 8px; max-height: 300px; overflow-y: auto; }
  li a { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; color: inherit; text-decoration: none; }
  li a:hover, li a:focus-visible { background: var(--fundo); outline: none; }
  .mini { width: 38px; height: 38px; border-radius: 6px; background: var(--linha) center/cover no-repeat; flex: none; }
  .txt { min-width: 0; }
  .txt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txt span { color: var(--cinza); font-size: 12px; }
  .vazio { padding: 6px 16px 14px; color: var(--cinza); }
  form { display: flex; gap: 8px; padding: 0 16px 6px; }
  input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--linha); border-radius: 8px; font: inherit; }
  input:focus { outline: 2px solid var(--azul); outline-offset: -1px; }
  button { padding: 7px 12px; border: 0; border-radius: 8px; background: var(--tinta); color: #fff; font: 600 12.5px/1 inherit; cursor: pointer; }
  .nota { padding: 0 16px 10px; color: var(--cinza); font-size: 11.5px; }
  .nota.ok { color: var(--ok); }
  footer { border-top: 1px solid var(--linha); padding: 10px 16px 12px; }
  footer a { color: var(--azul); text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <img src="icones/icone-48.png" alt="">
    <div><b>Pegaí</b><small>Clique no botão de baixar em qualquer post. Carrossel: o botão azul baixa todas as fotos.</small></div>
  </header>
  <h2>Últimos downloads</h2>
  <ul id="lista"></ul>
  <p class="vazio" id="vazio" hidden>Nada baixado ainda.</p>
  <h2>Pasta em Downloads</h2>
  <form id="form-pasta">
    <input id="pasta" aria-label="Pasta dentro de Downloads" spellcheck="false" autocomplete="off">
    <button type="submit">Salvar</button>
  </form>
  <p class="nota" id="nota-pasta">Os arquivos vão para Downloads/<b id="pasta-atual">Pegai</b>. Coleções ficam em Coleções/.</p>
  <footer><a id="ajuda-salvar">O Chrome pergunta onde salvar cada arquivo? Desligar</a></footer>
  <script src="popup.js"></script>
</body>
</html>
